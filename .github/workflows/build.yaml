name: clone and build zig master

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: "llvm.sh -h"
      run: |
        curl -fsSL -O https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh && ./llvm.sh -h || echo "QoO0oQOo00OoQ0Qo0"

    - name: "zig build --help"
      run: |
        mkdir .zig && cd .zig && wget https://ziglang.org/builds/zig-x86_64-linux-0.16.0-dev.1892+53ebfde6b.tar.xz
        tar xf zig-x86_64-linux-0.16.0-dev.1892+53ebfde6b.tar.xz
        mkdir zig && cd ../zig/
        wget https://ziglang.org/builds/zig-0.16.0-dev.1859+212968c57.tar.xz
        tar xf zig-0.16.0-dev.1859+212968c57.tar.xz
        mv zig-0.16.0-dev.1859+212968c57/* .
        time ../.zig/zig-x86_64-linux-0.16.0-dev.1892+53ebfde6b/zig build --help
        exit 1

    - name: "build"
      run: |
        sudo apt-get update
        sudo apt-get install cmake -y

        curl -fsSL -O https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh && sudo ./llvm.sh 21 all
        sudo apt-get install lld-21 liblld-21-dev -y


        cd zig && mkdir build && cd build
        cmake .. && make install

    - name: "check prefix"
      run: ls -lah zig/build/stage3/bin/zig